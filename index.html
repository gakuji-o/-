<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教材配布確認システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    #reader video { object-fit: cover; border-radius: 0.75rem; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-10">

  <!-- ★ここにご自身のGASウェブアプリURLを貼り付けてください★ -->
  <script>
    const GAS_API_URL = "const GAS_API_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";";
  </script>

  <!-- ヘッダー -->
  <header class="bg-indigo-700 text-white shadow-md p-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>📚</span> 教材配布確認システム
      </h1>
      <div class="flex items-center gap-2 text-sm bg-indigo-800 px-3 py-1.5 rounded-lg">
        <label for="deliveryCodeSelect" class="text-indigo-200">学期コード:</label>
        <select id="deliveryCodeSelect" class="bg-indigo-900 text-white font-semibold rounded px-2 py-1 outline-none">
          <option value="2610">2610</option>
          <option value="2607">2607</option>
        </select>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-6">

    <!-- スキャン & 入力エリア -->
    <section class="bg-white rounded-xl shadow-md p-6 border border-slate-200 space-y-4">
      <div class="max-w-2xl mx-auto space-y-3">
        <div class="flex justify-between items-center">
          <label for="studentIdInput" class="block text-sm font-bold text-slate-700 flex items-center gap-2">
            <span>🔍</span> 学籍番号入力 / バーコードスキャン
          </label>
          <button onclick="toggleCamera()" class="text-xs bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-3 py-1.5 rounded-lg font-bold border border-indigo-200 transition">
            📷 カメラ起動 / 停止
          </button>
        </div>
        
        <div class="flex gap-3">
          <input type="text" id="studentIdInput" placeholder="学籍番号を入力（例: HW202501059）" 
                 class="w-full px-5 py-3.5 border-2 border-indigo-200 rounded-xl text-xl font-mono focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 outline-none transition"
                 onkeydown="if(event.key==='Enter') searchStudent()" autofocus>
          
          <button onclick="searchStudent()" 
                  class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-lg px-8 py-3.5 rounded-xl font-bold transition duration-150 shadow-md flex-shrink-0">
            検索
          </button>
        </div>
        
        <p id="statusMessage" class="text-sm text-slate-500 font-medium">
          学籍番号をスキャンするか、直接入力して検索してください。
        </p>

        <!-- カメラ枠（ボタンで開閉） -->
        <div id="cameraArea" class="hidden pt-3 border-t border-slate-100 mt-3">
          <div id="reader" class="w-full bg-slate-900 rounded-xl overflow-hidden min-h-[250px] flex items-center justify-center text-slate-400 text-sm">
            カメラ準備中...
          </div>
        </div>
      </div>
    </section>

    <!-- メインコンテンツ：左右分割レイアウト -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-6">

      <!-- 左側：学生基本情報 -->
      <section class="md:col-span-4 bg-white rounded-xl shadow-sm p-5 border border-slate-200 h-fit">
        <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider border-b pb-2 mb-4">学生基本情報</h2>
        
        <div id="studentCard" class="space-y-4">
          <div class="text-center py-12 text-slate-400">
            <svg class="w-16 h-16 mx-auto mb-3 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <p class="text-sm">学生を検索すると<br>ここに情報が表示されます</p>
          </div>
        </div>
      </section>

      <!-- 右側：教材ステータス -->
      <section class="md:col-span-8 space-y-6">

        <!-- 右上：今回配布する教材 -->
        <div class="bg-white rounded-xl shadow-sm p-5 border border-emerald-200">
          <div class="flex justify-between items-center border-b border-emerald-100 pb-3 mb-4">
            <h2 class="text-base font-bold text-emerald-800 flex items-center gap-2">
              <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
              今回配布する教材（未配布）
            </h2>
            <span id="toDeliverCount" class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-full">0件</span>
          </div>

          <div id="toDeliverList" class="space-y-2">
            <p class="text-slate-400 text-sm py-4 text-center">該当する対象教材はありません</p>
          </div>
        </div>

        <!-- 右下：すでに配布済みの教材 -->
        <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-200">
          <div class="flex justify-between items-center border-b pb-3 mb-4">
            <h2 class="text-base font-bold text-slate-700 flex items-center gap-2">
              <span class="w-3 h-3 rounded-full bg-slate-400 inline-block"></span>
              すでに配布済みの教材
            </h2>
            <span id="alreadyDeliveredCount" class="bg-slate-100 text-slate-700 text-xs font-bold px-2.5 py-1 rounded-full">0件</span>
          </div>

          <div id="alreadyDeliveredList" class="space-y-2">
            <p class="text-slate-400 text-sm py-4 text-center">配布履歴はありません</p>
          </div>
        </div>

      </section>

    </div>
  </main>

  <script>
    let html5QrcodeScanner = null;

    window.onload = function() {
      focusInput();
    };

    function focusInput() {
      const input = document.getElementById('studentIdInput');
      input.focus();
      input.select();
    }

    function toggleCamera() {
      const cameraArea = document.getElementById('cameraArea');
      
      if (cameraArea.classList.contains('hidden')) {
        cameraArea.classList.remove('hidden');
        startCamera();
      } else {
        stopCamera();
        cameraArea.classList.add('hidden');
      }
    }

    function startCamera() {
      html5QrcodeScanner = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 250, height: 160 } };

      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      ).catch(err => {
        document.getElementById('reader').innerText = "カメラ起動エラー: " + err;
      });
    }

    function stopCamera() {
      if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
        html5QrcodeScanner.stop();
      }
    }

    function onScanSuccess(decodedText) {
      document.getElementById('studentIdInput').value = decodedText;
      searchStudent();
      stopCamera();
      document.getElementById('cameraArea').classList.add('hidden');
    }

    async function searchStudent() {
      const inputEl = document.getElementById('studentIdInput');
      const studentId = inputEl.value.trim();
      const deliveryCode = document.getElementById('deliveryCodeSelect').value;
      const statusMsg = document.getElementById('statusMessage');

      if (!studentId) {
        statusMsg.innerText = "学籍番号を入力してください。";
        statusMsg.className = "text-sm text-red-500 font-medium";
        focusInput();
        return;
      }

      statusMsg.innerText = "検索中...";
      statusMsg.className = "text-sm text-indigo-600 font-medium animate-pulse";

      try {
        // GAS APIへ通信（fetch）
        const url = `${GAS_API_URL}?studentId=${encodeURIComponent(studentId)}&deliveryCode=${encodeURIComponent(deliveryCode)}`;
        const response = await fetch(url);
        const res = await response.json();

        renderResult(res);
        focusInput();
      } catch (err) {
        statusMsg.innerText = "通信エラー: " + err.message;
        statusMsg.className = "text-sm text-red-500 font-medium";
        focusInput();
      }
    }

    function renderResult(res) {
      const statusMsg = document.getElementById('statusMessage');
      
      if (!res.success) {
        statusMsg.innerText = res.message;
        statusMsg.className = "text-sm text-red-500 font-medium";
        return;
      }

      statusMsg.innerText = "検索完了（" + res.student.name + " 様）";
      statusMsg.className = "text-sm text-emerald-600 font-medium";

      // 左側：学生情報
      const student = res.student;
      document.getElementById('studentCard').innerHTML = `
        <div class="space-y-3">
          <div>
            <span class="text-xs text-slate-400 block">学籍番号</span>
            <span class="text-lg font-bold font-mono text-indigo-900">${student.studentId}</span>
          </div>
          <div>
            <span class="text-xs text-slate-400 block">氏名</span>
            <span class="text-xl font-extrabold text-slate-800">${student.name}</span>
          </div>
          
          <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100">
            <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100">
              <span class="text-xs text-slate-400 block">現クラス (E列)</span>
              <span class="text-base font-bold text-slate-700">${student.className}</span>
            </div>
            <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100">
              <span class="text-xs text-slate-400 block">現レベル</span>
              <span class="text-base font-bold text-slate-700">${student.level}</span>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div class="bg-slate-50/70 p-2.5 rounded-lg border border-slate-100">
              <span class="text-xs text-slate-400 block">前クラス (C列)</span>
              <span class="text-base font-semibold text-slate-600">${student.pastClassName}</span>
            </div>
            <div class="bg-slate-50/70 p-2.5 rounded-lg border border-slate-100">
              <span class="text-xs text-slate-400 block">前レベル (D列)</span>
              <span class="text-base font-semibold text-slate-600">${student.pastLevel}</span>
            </div>
          </div>
        </div>
      `;

      // 右上：今回配布する教材
      const toDeliverList = document.getElementById('toDeliverList');
      document.getElementById('toDeliverCount').innerText = res.toDeliver.length + '件';
      
      if (res.toDeliver.length === 0) {
        toDeliverList.innerHTML = `<p class="text-slate-400 text-sm py-4 text-center">今回配布対象の教材はありません</p>`;
      } else {
        toDeliverList.innerHTML = res.toDeliver.map(item => `
          <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-lg flex justify-between items-center">
            <div>
              <div class="font-bold text-emerald-950">${item.name}</div>
              <div class="text-xs text-emerald-700 font-mono">ISBN: ${item.isbn}</div>
            </div>
            <span class="bg-emerald-600 text-white text-xs px-2.5 py-1 rounded font-bold shadow-sm">配布対象</span>
          </div>
        `).join('');
      }

      // 右下：すでに配布済みの教材
      const alreadyList = document.getElementById('alreadyDeliveredList');
      document.getElementById('alreadyDeliveredCount').innerText = res.alreadyDelivered.length + '件';

      if (res.alreadyDelivered.length === 0) {
        alreadyList.innerHTML = `<p class="text-slate-400 text-sm py-4 text-center">配布履歴はありません</p>`;
      } else {
        alreadyList.innerHTML = res.alreadyDelivered.map(item => `
          <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg flex justify-between items-center">
            <div>
              <div class="font-medium text-slate-800">${item.name}</div>
              <div class="text-xs text-slate-400 font-mono">ISBN: ${item.isbn}</div>
            </div>
            <span class="bg-slate-200 text-slate-700 text-xs px-2.5 py-1 rounded font-semibold">コード: ${item.code}</span>
          </div>
        `).join('');
      }
    }
  </script>
</body>
</html>
